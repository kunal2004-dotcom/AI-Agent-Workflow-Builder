# Hasura Event Triggers
# These fire when specific table row changes occur

# db_event trigger: fires when a new row is inserted into workflow_runs with trigger_type='db_event'
# The notify step type fires an async webhook (Slack/email) when a workflow step executes
# The db_event trigger fires when any table we're watching has a row change

# Note: Event triggers are defined in the Hasura console or via metadata.
# For the 'db_event' workflow trigger type, we create an event trigger on a 
# 'watched_events' table that calls the db-event-trigger function.
# This function then finds all workflows with a matching db_event trigger config and starts runs.

# To configure via Hasura console:
# 1. Create the watched_events table (via migration)
# 2. Add an Event Trigger on INSERT of watched_events → POST /v1/functions/db-event-trigger

# The watched_events table is created in the migration with:
# CREATE TABLE public.watched_events (
#   id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
#   event_type TEXT NOT NULL,
#   payload JSONB NOT NULL DEFAULT '{}',
#   created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
# );
