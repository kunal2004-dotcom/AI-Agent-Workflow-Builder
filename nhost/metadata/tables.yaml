- table:
    name: organizations
    schema: public
  configuration:
    column_config: {}
    custom_column_names: {}
    custom_root_fields: {}
  array_relationships:
    - name: org_members
      using:
        foreign_key_constraint_on:
          column: org_id
          table:
            name: org_members
            schema: public
    - name: workflows
      using:
        foreign_key_constraint_on:
          column: org_id
          table:
            name: workflows
            schema: public
  select_permissions:
    - role: user
      permission:
        columns:
          - id
          - name
          - quota_limit
          - quota_used
          - quota_reset_at
          - created_at
          - updated_at
        # User can only see orgs they belong to
        filter:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
        allow_aggregations: false
  insert_permissions:
    - role: user
      permission:
        # Any authenticated user can create an org (becomes owner via create-organization action)
        check: {}
        columns:
          - name
          - quota_limit
  update_permissions:
    - role: user
      permission:
        columns:
          - name
          - quota_limit
          - quota_used
          - quota_reset_at
          - updated_at
        # Only org owners can update org settings
        filter:
          org_members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
  delete_permissions:
    - role: user
      permission:
        # Only org owners can delete the org
        filter:
          org_members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
- table:
    name: org_members
    schema: public
  configuration:
    column_config: {}
    custom_column_names: {}
    custom_root_fields: {}
  object_relationships:
    - name: organization
      using:
        foreign_key_constraint_on: org_id
    - name: user
      using:
        foreign_key_constraint_on: user_id
  select_permissions:
    - role: user
      permission:
        columns:
          - id
          - org_id
          - user_id
          - role
          - created_at
        # Any member of an org can see the org's membership list
        filter:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
        allow_aggregations: false
  insert_permissions:
    - role: user
      permission:
        # Only owners can add members to their org
        check:
          organization:
            org_members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: owner
        columns:
          - org_id
          - user_id
          - role
  update_permissions:
    - role: user
      permission:
        columns:
          - role
        # Only owners can change member roles
        filter:
          organization:
            org_members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: owner
  delete_permissions:
    - role: user
      permission:
        # Only owners can remove members
        filter:
          organization:
            org_members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: owner
- table:
    name: step_runs
    schema: public
  configuration:
    column_config: {}
    custom_column_names: {}
    custom_root_fields: {}
  object_relationships:
    - name: workflow_run
      using:
        foreign_key_constraint_on: workflow_run_id
    - name: workflow_step
      using:
        foreign_key_constraint_on: step_id
    - name: approver
      using:
        foreign_key_constraint_on: approved_by
  select_permissions:
    - role: user
      permission:
        columns:
          - id
          - workflow_run_id
          - step_id
          - status
          - input
          - output
          - error
          - attempt_count
          - approved_by
          - approved_at
          - started_at
          - completed_at
          - created_at
        # SUBSCRIPTION TARGET: any member of the org can watch step progress live
        # The 4-level nested filter ensures strict org isolation
        filter:
          workflow_run:
            workflow:
              organization:
                org_members:
                  user_id:
                    _eq: X-Hasura-User-Id
        allow_aggregations: false
    # step_runs are written ONLY by the Action handlers via admin secret â€” no user-role mutations
- table:
    name: workflows
    schema: public
  configuration:
    column_config: {}
    custom_column_names: {}
    custom_root_fields: {}
  object_relationships:
    - name: organization
      using:
        foreign_key_constraint_on: org_id
    - name: creator
      using:
        foreign_key_constraint_on: created_by
  array_relationships:
    - name: workflow_steps
      using:
        foreign_key_constraint_on:
          column: workflow_id
          table:
            name: workflow_steps
            schema: public
    - name: workflow_triggers
      using:
        foreign_key_constraint_on:
          column: workflow_id
          table:
            name: workflow_triggers
            schema: public
    - name: workflow_runs
      using:
        foreign_key_constraint_on:
          column: workflow_id
          table:
            name: workflow_runs
            schema: public
  select_permissions:
    - role: user
      permission:
        columns:
          - id
          - org_id
          - name
          - description
          - is_active
          - created_by
          - created_at
          - updated_at
        # Any member can read workflows in their org
        filter:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
        allow_aggregations: true
  insert_permissions:
    - role: user
      permission:
        # Only owners and editors can create workflows
        check:
          organization:
            org_members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _in:
                      - owner
                      - editor
        set:
          created_by: x-hasura-User-Id
        columns:
          - org_id
          - name
          - description
          - is_active
  update_permissions:
    - role: user
      permission:
        columns:
          - name
          - description
          - is_active
          - updated_at
        # Only owners and editors can update workflows
        filter:
          organization:
            org_members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _in:
                      - owner
                      - editor
  delete_permissions:
    - role: user
      permission:
        # Only owners can delete workflows
        filter:
          organization:
            org_members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: owner
- table:
    name: workflow_runs
    schema: public
  configuration:
    column_config: {}
    custom_column_names: {}
    custom_root_fields: {}
  object_relationships:
    - name: workflow
      using:
        foreign_key_constraint_on: workflow_id
    - name: triggered_by_user
      using:
        foreign_key_constraint_on: triggered_by
  array_relationships:
    - name: step_runs
      using:
        foreign_key_constraint_on:
          column: workflow_run_id
          table:
            name: step_runs
            schema: public
  select_permissions:
    - role: user
      permission:
        columns:
          - id
          - workflow_id
          - status
          - trigger_type
          - triggered_by
          - started_at
          - completed_at
          - current_step_index
          - context
          - error_message
          - created_at
        # Any member of the org can view run history
        filter:
          workflow:
            organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
        allow_aggregations: true
    # workflow_runs are created and updated ONLY via the Action handler (admin secret)
    # No insert/update/delete permissions for the "user" role â€” all managed server-side
- table:
    name: workflow_steps
    schema: public
  configuration:
    column_config: {}
    custom_column_names: {}
    custom_root_fields: {}
  object_relationships:
    - name: workflow
      using:
        foreign_key_constraint_on: workflow_id
  array_relationships:
    - name: step_runs
      using:
        foreign_key_constraint_on:
          column: step_id
          table:
            name: step_runs
            schema: public
  select_permissions:
    - role: user
      permission:
        columns:
          - id
          - workflow_id
          - type
          - config
          - order_index
          - created_at
          - updated_at
        # Any member can see steps of workflows in their org
        filter:
          workflow:
            organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
        allow_aggregations: false
  insert_permissions:
    - role: user
      permission:
        # LAYER 2: owners can add any step type; editors cannot add db_write/notify/approval_gate
        # Restriction on sensitive types is enforced in the check constraint:
        check:
          _and:
            - workflow:
                organization:
                  org_members:
                    _and:
                      - user_id:
                          _eq: X-Hasura-User-Id
                      - role:
                          _in:
                            - owner
                            - editor
            # If step type is sensitive, caller must be owner
            - _or:
                - type:
                    _nin:
                      - db_write
                      - notify
                - workflow:
                    organization:
                      org_members:
                        _and:
                          - user_id:
                              _eq: X-Hasura-User-Id
                          - role:
                              _eq: owner
        columns:
          - workflow_id
          - type
          - config
          - order_index
  update_permissions:
    - role: user
      permission:
        columns:
          - type
          - config
          - order_index
          - updated_at
        # Only owners and editors can edit steps
        filter:
          workflow:
            organization:
              org_members:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _in:
                        - owner
                        - editor
  delete_permissions:
    - role: user
      permission:
        # Owners and editors can delete steps
        filter:
          workflow:
            organization:
              org_members:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _in:
                        - owner
                        - editor
