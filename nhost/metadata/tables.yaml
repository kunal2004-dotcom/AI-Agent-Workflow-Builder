          - type
          - config
          - is_active
  update_permissions:
    - role: user
      permission:
        columns:
          - type
          - config
          - is_active
        filter:
          workflow:
            organization:
              org_members:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _eq: owner
  delete_permissions:
    - role: user
      permission:
        filter:
          workflow:
            organization:
              org_members:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _eq: owner

