table:
  name: step_runs
  schema: public
configuration:
  column_config: {}
  custom_column_names: {}
  custom_root_fields: {}
object_relationships:
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: workflow_step
    using:
      foreign_key_constraint_on: step_id
  - name: approver
    using:
      foreign_key_constraint_on: approved_by
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_run_id
        - step_id
        - status
        - input
        - output
        - error
        - attempt_count
        - approved_by
        - approved_at
        - started_at
        - completed_at
        - created_at
      # SUBSCRIPTION TARGET: any member of the org can watch step progress live
      # The 4-level nested filter ensures strict org isolation
      filter:
        workflow_run:
          workflow:
            organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
      allow_aggregations: false
  # step_runs are written ONLY by the Action handlers via admin secret — no user-role mutations
