table:
  name: org_members
  schema: public
configuration:
  column_config: {}
  custom_column_names: {}
  custom_root_fields: {}
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - org_id
        - user_id
        - role
        - created_at
      # Any member of an org can see the org's membership list
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
      allow_aggregations: false
insert_permissions:
  - role: user
    permission:
      # Only owners can add members to their org
      check:
        organization:
          org_members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
      columns:
        - org_id
        - user_id
        - role
update_permissions:
  - role: user
    permission:
      columns:
        - role
      # Only owners can change member roles
      filter:
        organization:
          org_members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
delete_permissions:
  - role: user
    permission:
      # Only owners can remove members
      filter:
        organization:
          org_members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
