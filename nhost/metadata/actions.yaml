actions:
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: "{{NHOST_FUNCTIONS_URL}}/trigger-workflow-run"
      forward_client_headers: true
      timeout: 300
      request_transform:
        method: POST
        content_type: application/json
    permissions:
      - role: user
    comment: "Executes a workflow run. Checks caller is owner/editor in the workflow's org, checks quota, then executes steps sequentially."

  - name: approveStep
    definition:
      kind: synchronous
      handler: "{{NHOST_FUNCTIONS_URL}}/approve-step"
      forward_client_headers: true
      timeout: 300
      request_transform:
        method: POST
        content_type: application/json
    permissions:
      - role: user
    comment: "Approves a paused approval_gate step. Action handler checks approver role (owner/editor) before resuming execution."

  - name: createOrganization
    definition:
      kind: synchronous
      handler: "{{NHOST_FUNCTIONS_URL}}/create-organization"
      forward_client_headers: true
      timeout: 30
      request_transform:
        method: POST
        content_type: application/json
    permissions:
      - role: user
    comment: "Atomically creates an organization and inserts the caller as owner in org_members."

  - name: webhookTriggerWorkflow
    definition:
      kind: synchronous
      handler: "{{NHOST_FUNCTIONS_URL}}/webhook-trigger"
      forward_client_headers: false
      timeout: 300
      request_transform:
        method: POST
        content_type: application/json
    permissions:
      - role: user
    comment: "Inbound webhook endpoint — external systems call this Action to start a workflow run."

custom_types:
  enums: []
  input_objects:
    - name: TriggerWorkflowInput
      fields:
        - name: workflow_id
          type: uuid!
        - name: input_data
          type: jsonb
    - name: ApproveStepInput
      fields:
        - name: step_run_id
          type: uuid!
    - name: CreateOrganizationInput
      fields:
        - name: name
          type: String!
    - name: WebhookTriggerInput
      fields:
        - name: workflow_id
          type: uuid!
        - name: data
          type: jsonb
  objects:
    - name: WorkflowRunResult
      fields:
        - name: run_id
          type: uuid!
        - name: status
          type: String!
        - name: message
          type: String
    - name: ApproveStepResult
      fields:
        - name: success
          type: Boolean!
        - name: message
          type: String!
        - name: run_status
          type: String
    - name: CreateOrganizationResult
      fields:
        - name: org_id
          type: uuid!
        - name: name
          type: String!
  scalars: []
